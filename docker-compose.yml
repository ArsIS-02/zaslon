# Готовый образ: docker compose pull && docker compose up -d
# Сборка из исходников:   docker compose up -d --build
services:
  zaslon:
    build:
      context: .
      args:
        WITH_PDF: "${ZASLON_WITH_PDF:-1}"
        ZASLON_UID: "${ZASLON_UID:-1000}"
        ZASLON_GID: "${ZASLON_GID:-1000}"
    image: ghcr.io/arsis-02/zaslon:${ZASLON_TAG:-latest}
    container_name: zaslon
    restart: unless-stopped
    # процесс работает от имени вашего пользователя: файлы в ./data (и ключ панели) принадлежат вам
    user: "${ZASLON_UID:-1000}:${ZASLON_GID:-1000}"
    ports:
      - "${ZASLON_BIND:-0.0.0.0}:${ZASLON_PORT:-8585}:8585"
    volumes:
      # :Z — метка SELinux
      - ./data:/data:Z
    environment:
      - ZASLON_LOGIN=${ZASLON_LOGIN:-admin}
      - ZASLON_PASSWORD=${ZASLON_PASSWORD:-}
      - TZ=${TZ:-UTC}
